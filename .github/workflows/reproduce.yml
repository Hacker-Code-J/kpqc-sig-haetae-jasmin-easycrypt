name: Research artifact

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Verification scope
        type: choice
        options: [quick, full]
        default: quick

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      JOBS: "2"
      REPRODUCE_MODE: ${{ inputs.mode || 'quick' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y opam build-essential cmake ninja-build git python3 \
            wget unzip bzip2 pkg-config libssl-dev libgmp-dev libpcre2-dev libppl-dev \
            libmpfr-dev zlib1g-dev autoconf automake libtool cvc4
      - name: Reconstruct the toolchain
        run: bash env/bootstrap.sh 2>&1 | tee env/bootstrap.log
      - name: Reproduce
        run: |
          source env/activate.sh
          bash scripts/reproduce.sh "$REPRODUCE_MODE"
      - name: Preserve execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reproduction-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            build/reproduction/
            haetae-easycrypt/logs/
            haetae-hardened/logs/
            env/bootstrap.log
            env/installed-packages.txt
